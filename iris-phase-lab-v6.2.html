<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="bb-build" content="iris-phase-lab-v6.2-2026-08-23"><title>IRIS Phase Lab v6.2</title>
<style>
html,body{margin:0;height:100%;background:#050506;color:#9EA2A6;font:12px/1.5 ui-monospace,Menlo,monospace;overflow:hidden}
#stage{position:fixed;inset:0}
#phaseCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;left:14px;bottom:14px;width:340px;background:rgba(5,5,6,.88);border:1px solid #232326;padding:10px 12px;display:grid;gap:6px;z-index:2}
#ui label{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center}
#ui input[type=range]{width:100%}
#ui button{background:#0c0c0e;color:#F2F2EF;border:1px solid #232326;padding:4px 8px;font:inherit;cursor:pointer}
#out{white-space:pre;color:#5C5C61}
#fps{position:fixed;right:14px;top:12px;color:#5C5C61}
.lm{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border:1px solid #C8102E;border-radius:50%;pointer-events:none}
</style></head>
<body>
<div id="stage"><canvas id="phaseCanvas"></canvas><div id="lmLayer"></div></div>
<div id="fps">— fps</div>
<div id="ui">
  <b style="color:#F2F2EF">IRIS PHASE LAB v6.2</b>
  <label>corridor <select id="cor"><option value="0">AWARE → DNA</option><option value="1">DNA → BLOOD</option><option value="2">BLOOD → SKIN</option><option value="3">SKIN → WORK APERTURE</option><option value="4">WORK APERTURE → REVEAL</option></select></label>
  <label>q <input id="q" type="range" min="0" max="1" step="0.005" value="0"></label>
  <label>speed s <input id="spd" type="range" min="2" max="16" step="1" value="7"></label>
  <div><button id="fwd">play ▶</button> <button id="rev">◀ reverse</button> <button id="pause">pause</button> <label style="display:inline-grid;grid-template-columns:auto auto"><input id="sil" type="checkbox"> silhouette</label> <label style="display:inline-grid;grid-template-columns:auto auto"><input id="lm" type="checkbox"> landmarks</label></div>
  <div id="out"></div>
</div>
<script src="iris-phase-engine-v6.2.js"></script>
<script>
(function(){
'use strict';
var cv=document.getElementById('phaseCanvas'), E=window.IrisPhaseEngine, rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
E.init({canvas:cv, scarAngle:4.1, reducedMotion:rm});
function clamp(v,a,b){ return v<a?a:v>b?b:v; } function sstep(a,b,x){ var t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
var W=0,H=0,PX=1; function size(){ W=innerWidth; H=innerHeight; PX=Math.min(1.5,devicePixelRatio||1); E.resize({width:W,height:H,pixelRatio:PX}); } size(); addEventListener('resize',size,{passive:true});
/* the lab builds the same plan the website adapter builds: one global phase, serial choreography */
var PLAN={ enabled:true, corridor:'', fromState:0, toState:1, rawQ:0, easedQ:0, copyOut:0, carryIn:0, morph:0, settle:0, carryOut:0, copyIn:0,
  viewportWidth:0, viewportHeight:0, sourceX:0,sourceY:0,sourceRadius:0, stageX:0,stageY:0,stageRadius:0, targetX:0,targetY:0,targetRadius:0,
  bodyX:0,bodyY:0,bodyRadius:0, irisAlpha:0, phaseAlpha:1, workAlpha:0, scrollVelocity:0, direction:1, reducedMotion:rm, silhouette:false, glint:true };
var cor=0, q=0, play=0, sil=false, showLm=false;
function plan(){
  PLAN.corridor=['AWARE_DNA','DNA_BLOOD','BLOOD_SKIN','SKIN_WORK','WORK_REVEAL'][cor]; PLAN.fromState=cor; PLAN.toState=cor+1; PLAN.rawQ=q; PLAN.easedQ=q;
  PLAN.copyOut=sstep(0,.10,q); PLAN.carryIn=sstep(.10,.20,q); PLAN.morph=sstep(.20,.76,q); PLAN.settle=sstep(.76,.84,q); PLAN.carryOut=sstep(.84,.92,q); PLAN.copyIn=sstep(.92,1,q);
  PLAN.viewportWidth=W; PLAN.viewportHeight=H;
  var mob=W<820, stageR=(mob?.33:.19)*W; PLAN.stageX=W*.5; PLAN.stageY=H*.5; PLAN.stageRadius=stageR;
  PLAN.bodyX=PLAN.stageX; PLAN.bodyY=PLAN.stageY; PLAN.bodyRadius=stageR; PLAN.silhouette=sil;
  PLAN.phaseAlpha=1; PLAN.workAlpha=(cor===3)? sstep(.7,.76,PLAN.morph) : (cor===4 ? 1-sstep(0,.06,PLAN.morph) : 0); PLAN.irisAlpha=0;
  PLAN.reducedMotion=rm;
}
var last=performance.now(), fpsN=0, fpsT=0, fpsEl=document.getElementById('fps'), out=document.getElementById('out'), lmLayer=document.getElementById('lmLayer');
function frame(now){ requestAnimationFrame(frame); var dt=Math.min(.05,(now-last)/1000); last=now;
  var spd=+document.getElementById('spd').value; if(play){ q=clamp(q+play*dt/spd,0,1); document.getElementById('q').value=q; if(q<=0||q>=1) play=0; }
  plan(); E.update(PLAN); E.render();
  var d=E.getDiagnostics(); fpsN++; fpsT+=dt; if(fpsT>.5){ fpsEl.textContent=(fpsN/fpsT).toFixed(0)+' fps · render '+d.renderMs.toFixed(2)+' ms'; fpsN=0; fpsT=0; }
  out.textContent='state '+d.state+'  q '+q.toFixed(3)+'  morph '+PLAN.morph.toFixed(3)+'\ncopyOut '+PLAN.copyOut.toFixed(2)+' carryIn '+PLAN.carryIn.toFixed(2)+' settle '+PLAN.settle.toFixed(2)+' carryOut '+PLAN.carryOut.toFixed(2)+' copyIn '+PLAN.copyIn.toFixed(2)+'\ncontour R '+d.contourMinR.toFixed(0)+'–'+d.contourMaxR.toFixed(0)+' px  workAlpha '+PLAN.workAlpha.toFixed(2);
  if(showLm){ if(lmLayer.children.length!==12){ lmLayer.innerHTML=''; for(var i=0;i<12;i++){ var s=document.createElement('span'); s.className='lm'; lmLayer.appendChild(s); } }
    for(var k=0;k<12;k++){ var L=d.landmarks[k], el=lmLayer.children[k]; el.style.left=L.x+'px'; el.style.top=L.y+'px'; } } else if(lmLayer.children.length) lmLayer.innerHTML='';
}
requestAnimationFrame(frame);
document.getElementById('cor').addEventListener('change',function(){ cor=+this.value; });
document.getElementById('q').addEventListener('input',function(){ q=+this.value; play=0; });
document.getElementById('fwd').addEventListener('click',function(){ play=1; }); document.getElementById('rev').addEventListener('click',function(){ play=-1; }); document.getElementById('pause').addEventListener('click',function(){ play=0; });
document.getElementById('sil').addEventListener('change',function(){ sil=this.checked; }); document.getElementById('lm').addEventListener('change',function(){ showLm=this.checked; });
window.__LAB={ set:function(c,qq,s){ cor=c; q=qq; if(s!=null) sil=!!s; play=0; document.getElementById('cor').value=c; document.getElementById('q').value=qq; }, plan:PLAN, engine:E, diag:function(){ return E.getDiagnostics(); }, hideUI:function(){ document.getElementById('ui').style.display='none'; document.getElementById('fps').style.display='none'; } };
})();
</script>
</body></html>
